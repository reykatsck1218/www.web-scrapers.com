{# ===== Site header (design-system chrome; overrides the theme partial) ===== #}
<header class="header" id="site-header">
    <div class="shell">
        <div class="header__inner">
            <a href="/" class="logo" aria-label="web-scrapers.com home">
                <span class="logo__dot" aria-hidden="true"></span>
                <span>web-scrapers<span class="logo__tld">.com</span></span>
            </a>

            <nav class="header__nav" id="site-nav" aria-label="Main navigation">
                {% if config.extra.nav %}
                {% for item in config.extra.nav %}
                <a href="{{ item.url }}" class="header__link"{% if current_path is defined and current_path == item.url %} aria-current="page"{% endif %}>{{ item.name }}</a>
                {% endfor %}
                {% endif %}
            </nav>

            <div class="header__tools">
                <div class="themetoggle" role="group" aria-label="Color theme">
                    <button type="button" data-theme-set="light" aria-label="Light theme" title="Light">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                    </button>
                    <button type="button" data-theme-set="auto" aria-label="Match system theme" title="Auto">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
                    </button>
                    <button type="button" data-theme-set="dark" aria-label="Dark theme" title="Dark">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    </button>
                </div>
                <a href="#newsletter" class="btn btn--secondary btn--sm header__newsletter">Join the newsletter</a>
                <button type="button" class="navtoggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
                    <span aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </div>
</header>
