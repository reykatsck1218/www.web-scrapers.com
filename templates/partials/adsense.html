{# ===== AdSense end-of-article unit (reserved slot, design-system .ad) ===== #}
{% if config.extra.adsense_client and config.extra.adsense_slot %}
<div class="ad ad--article" style="margin-top:var(--space-block)">
    <span class="ad__label">Advertisement</span>
    <ins class="adsbygoogle"
         style="display:block;width:100%"
         data-ad-client="{{ config.extra.adsense_client }}"
         data-ad-slot="{{ config.extra.adsense_slot }}"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{% endif %}
